name: Build pt-PT satellite resource DLL

on:
  push:
    branches:
      - localization/pt-PT-review
    paths:
      - 'Application/FileConverter/Properties/Resources.pt-PT.resx'
      - '.github/workflows/build-pt-pt-resources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-resource-dll:
    runs-on: windows-latest
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v5
        with:
          ref: localization/pt-PT-review

      - name: Compile only the pt-PT resource assembly
        shell: pwsh
        run: |
          $resx = "Application/FileConverter/Properties/Resources.pt-PT.resx"
          $outDir = "$env:RUNNER_TEMP\pt-PT"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Locate ResGen.exe using Visual Studio's locator, then search the
          # installed Visual Studio trees as a fallback.
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          $resgenPath = $null
          if (Test-Path $vswhere) {
            $matches = & $vswhere -latest -products '*' -find '**\ResGen.exe' 2>$null
            $resgenPath = $matches | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $resgenPath) {
            $vsRoots = @(
              (Join-Path $env:ProgramFiles "Microsoft Visual Studio"),
              (Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio")
            ) | Where-Object { Test-Path $_ }

            foreach ($root in $vsRoots) {
              $found = Get-ChildItem -Path $root -Filter ResGen.exe -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($found) {
                $resgenPath = $found.FullName
                break
              }
            }
          }

          if (-not $resgenPath) {
            throw "ResGen.exe was not found. The Windows runner may not have the required Visual Studio build tools installed."
          }

          $alPath = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\al.exe"
          if (-not (Test-Path $alPath)) {
            $alPath = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\al.exe"
          }
          if (-not (Test-Path $alPath)) { throw "al.exe was not found on the Windows runner." }

          & $resgenPath $resx "$outDir\FileConverter.resources.pt-PT.resources"
          if ($LASTEXITCODE -ne 0) { throw "ResGen failed with exit code $LASTEXITCODE" }

          & $alPath /t:lib /culture:pt-PT /embed:"$outDir\FileConverter.resources.pt-PT.resources" /out:"$outDir\FileConverter.resources.dll"
          if ($LASTEXITCODE -ne 0) { throw "Assembly Linker failed with exit code $LASTEXITCODE" }

          if (-not (Test-Path "$outDir\FileConverter.resources.dll")) { throw "Satellite assembly was not produced." }

      - name: Upload only FileConverter.resources.dll
        uses: actions/upload-artifact@v4
        with:
          name: FileConverter-resources-pt-PT
          path: ${{ runner.temp }}/pt-PT/FileConverter.resources.dll
          if-no-files-found: error
